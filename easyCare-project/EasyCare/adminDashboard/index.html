<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hospital Admin Panel</title>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
  <div class="nav-logo">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="#fff"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm7 13H5v-.23c0-.62.28-1.2.76-1.58C7.47 15.82 9.64 15 12 15s4.53.82 6.24 2.19c.48.38.76.97.76 1.58V19z"/></svg>
    EasyCare +
  </div>

  <div class="nav-links">
    <a href="../HomePage/Home.html">Home</a>
    <a href="../HospitallistPage/list-page/index.html">Hospital List</a>
    <a class="active">Admin Dashboard</a>
    <a href="../issueReport/index.html">Issue Report</a>
  </div>
</nav>

<div class="container">

  <!-- LOGIN -->
  <div class="card" id="loginPage" style="margin-top: 100px;">
    <div class="header">
      <i class="fa-solid fa-lock"></i>
      <h2>Admin Login</h2>
    </div>

    <input type="text" id="hospitalId" placeholder="Hospital ID" style="width: 270px;" />
    <input type="password" id="password" placeholder="Password" style="width: 270px;"/>

    <button onclick="login()">Login</button>
  </div>

  <!-- DASHBOARD -->
  <div class="card dashboard" id="dashboard" style="margin-top: -80px; width: 360px;">
    <div class="header">
      <i class="fa-solid fa-hospital"></i>
      <h2>Admin Dashboard</h2>
    </div>

    <p id="welcomeText"></p>

    <h3 style="margin-top: 20px; margin-bottom: 10px;" >Update Status</h3>

    <div class="status">
      <div class="normal" onclick="setStatus(this, 'Normal')">Normal</div>
      <div class="busy" onclick="setStatus(this, 'Busy')">Busy</div>
      <div class="critical" onclick="setStatus(this, 'Critical')">Critical</div>
    </div>

    <!-- BEDS -->
    <div class="row">
      <label>Total Beds</label>
      <input type="number" id="totalBeds" placeholder="Total beds">
    </div>

    <div class="row">
      <label>Available Beds</label>
      <input type="number" id="availableBeds" placeholder="Available beds">
    </div>

    <!-- ICU -->
    <div class="row">
      <label>Total ICU</label>
      <input type="number" id="totalICU" placeholder="Total ICU beds">
    </div>

    <div class="row">
      <label>Available ICU</label>
      <input type="number" id="availableICU" placeholder="Available ICU beds">
    </div>

    <!-- EMERGENCY -->
    <div class="row">
      <label>Emergency</label>
      <select id="emergency">
        <option>Available</option>
        <option>Busy</option>
        <option>Closed</option>
      </select>
    </div>

    <label>Reason:</label>
    <input type="text" id="reason" placeholder="Reason" style="width: 310px;"/>

    <button onclick="saveData()">Update Status</button>

  </div>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
